<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create password</title>
    <link rel="stylesheet" href="sign_in.css" />
    <link
      href="https://fonts.cdnfonts.com/css/sf-pro-display"
      rel="stylesheet"
    />
  </head>
  <body>
    <header>
      <section class="logo">
        <img src="../img/avion.png" alt="Avión" />
        <h1>my Dream Place</h1>
      </section>
    </header>

    <main>
      <h1>Create password</h1>
      <p>
        Use a minimum of 10 characters, including letters, lowercase letters,
        and numbers.
      </p>
      <form action="">
        <p>Email address</p>
        <input type="text" />
        <p>Password</p>
        <input type="text" />
      </form>

      <section class="opciones">
        <div class="keep_signed">
          <button></button>
          <p>Keep me signed in</p>
        </div>
        <a class="forgot">Forgot password?</a>
      </section>
      <button class="continue-email">Continue with email</button>
      <div class="divisor">or use one of these options</div>
      <button class="btn-google">
        <img src="../img/iconoGoogle.png" alt="Google" />Continue with Google
      </button>
      <button class="btn-facebook">
        <img src="../img/iconoFacebook.png" alt="Google" />Continue with
        Facebook
      </button>
      <p class="register">
        Don’t have an account? <a href="../register/register.html">Register</a>
      </p>
    </main>
  </body>
</html>
