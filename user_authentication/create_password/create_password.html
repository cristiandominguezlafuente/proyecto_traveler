<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Password</title>
    <link rel="stylesheet" href="create_password.css" />
    <link
      href="https://fonts.cdnfonts.com/css/sf-pro-display"
      rel="stylesheet"
    />
  </head>
  <body>
    <header>
      <section class="logo">
        <img src="../img/avion.png" alt="Avión" />
        <h1>my Dream Place</h1>
      </section>
    </header>

    <main>
      <h1>Register</h1>
      <form action="">
        <p>Email address</p>
        <input type="text" />
      </form>

      <button class="continue-email">Continue with email</button>
      <div class="divisor">or use one of these options</div>
      <button class="btn-google">
        <img src="../img/iconoGoogle.png" alt="Google" />Continue with Google
      </button>
      <button class="btn-facebook">
        <img src="../img/iconoFacebook.png" alt="Google" />Continue with
        Facebook
      </button>
      <p class="register">
        Already have an account? <a href="../sign-in/sign_in.html">Sign in</a>
      </p>
    </main>
  </body>
</html>
