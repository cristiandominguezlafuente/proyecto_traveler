<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create password</title>
    <link rel="stylesheet" href="create_password.css" />
    <link
      href="https://fonts.cdnfonts.com/css/sf-pro-display"
      rel="stylesheet"
    />
  </head>
  <body>
    <header>
      <section class="logo">
        <img src="../../img/avion.png" alt="Avión" />
        <h1>my Dream Place</h1>
      </section>
    </header>

    <main>
      <h1>Create password</h1>

      <p class="description">
        Use a minimum of 10 characters, including letters,<br />
        lowercase letters, and numbers.
      </p>

      <form action="">
        <p>Email address</p>
        <input type="email" />

        <p>Password</p>
        <input type="password" />
      </form>

      <button class="create-account-button">Create account</button>

      <p class="footer-description">
        By creating an account, you agree with our Terms and Conditions and
        Privacy Statement.
      </p>
    </main>
  </body>
</html>
