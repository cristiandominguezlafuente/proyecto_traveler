<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in</title>
    <link rel="stylesheet" href="user_authentication.css" />
    <link
      href="https://fonts.cdnfonts.com/css/sf-pro-display"
      rel="stylesheet"
    />
  </head>

  <body>
    
    <header>

    </header>

    <main class="login-container">
      <h1>Sign in</h1>

      <form class="login-form">
        <div class="campo-login">
          <label for="email">Email address</label>
          <input type="email" id="email" name="email" />
        </div>

        <div class="campo-login">
          <label for="password">Password</label>
          <div class="password-container">
            <input type="password" id="password" name="password" />
            <img src="img/iconoOjo.png" alt="Show password" />
          </div>
        </div>

        <div class="opciones-login">
          <label class="recordar">
            <input type="checkbox" />
            Keep me signed in
          </label>

          <a href="">Forgot password?</a>
        </div>

        <button class="btn-email" type="submit">Continue with email</button>

        <div class="separador">
          <span>or use one of these options</span>
        </div>

        <button class="btn-google" type="button">
          <span class="google-icon">G</span>
          Continue with Google
        </button>

        <button class="btn-facebook" type="button">
          <span class="facebook-icon">f</span>
          Continue with Facebook
        </button>
      </form>

      <p class="registro">
        Don’t have an account?
        <a href="">Register</a>
      </p>
    </main>
  </body>
</html>
